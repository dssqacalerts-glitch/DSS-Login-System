<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gate — Discovery Samal</title>
<meta name="theme-color" content="#0c1114">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  /* The same bones as the cafeteria screen, on purpose: a guard who has looked
     at one should not have to learn the other. Two colours only — in and out —
     because at a barrier those are the only two things that ever happen, and a
     screen with a colour for every case is a screen nobody reads.

     Nothing here says why anybody was refused. This board hangs where the
     public walks past; a refusal is a conversation for the guard, in person. */
  :root {
    --bg: #0c1114;
    --panel: #141c21;
    --panel-2: #1b262c;
    --line: #26343c;
    --text: #eef5f8;
    --text-2: #b3c4cd;
    --muted: #7d94a0;

    --in: #0ca30c;
    --in-wash: #0e2a12;
    --out: #3987e5;
    --out-wash: #101f31;
    --refused: #d03b3b;
    --refused-wash: #2c1516;

    --series-1: #3987e5;
    --series-2: #d95926;

    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen { height: 100dvh; display: flex; flex-direction: column; padding: 1.4vmin 1.6vmin; gap: 1.2vmin; }

  header {
    display: flex; align-items: baseline; gap: 1.6vmin; flex: 0 0 auto;
    padding: 0 .6vmin;
  }
  .site { font-size: clamp(15px, 1.9vmin, 26px); font-weight: 700; letter-spacing: -.01em; }
  .site span { color: var(--muted); font-weight: 500; }
  .spacer { flex: 1 1 auto; }
  .chip {
    font-size: clamp(11px, 1.4vmin, 18px); font-weight: 600; padding: .5vmin 1.2vmin;
    border-radius: 999px; background: var(--panel-2); color: var(--text-2); white-space: nowrap;
  }
  .chip.live { color: var(--in); }
  .chip.stale { background: var(--refused-wash); color: var(--refused); }
  .clock { font-size: clamp(18px, 2.6vmin, 40px); font-weight: 700; font-variant-numeric: tabular-nums; }

  main { flex: 1 1 auto; display: grid; gap: 1.2vmin; grid-template-columns: 1.55fr 1fr; min-height: 0; }
  @media (max-aspect-ratio: 1/1) { main { grid-template-columns: 1fr; grid-template-rows: 1.3fr 1fr; } }

  .col { display: grid; gap: 1.2vmin; min-height: 0; }
  .col.left { grid-template-rows: minmax(0, 1.15fr) minmax(0, 1fr); }
  .col.right { grid-template-rows: auto auto minmax(0, 1fr); }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 2vmin 2.2vmin; min-height: 0; display: flex; flex-direction: column;
  }
  .card h2 {
    margin: 0 0 1.2vmin; font-size: clamp(11px, 1.5vmin, 19px); font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  }

  /* ---- now serving ---- */
  .now { justify-content: center; transition: background .25s ease, border-color .25s ease; }
  .now.in { background: var(--in-wash); border-color: var(--in); }
  .now.out { background: var(--out-wash); border-color: var(--out); }
  .verdict {
    font-size: clamp(13px, 1.9vmin, 24px); font-weight: 800; letter-spacing: .18em;
    text-transform: uppercase; color: var(--muted);
  }
  .now.in .verdict { color: var(--in); }
  .now.out .verdict { color: var(--out); }
  .who {
    font-size: clamp(30px, 7.2vmin, 104px); font-weight: 800; letter-spacing: -.025em;
    line-height: 1.02; margin: .8vmin 0 .4vmin; text-wrap: balance;
  }
  .org { font-size: clamp(15px, 2.5vmin, 34px); color: var(--text-2); display: flex;
         align-items: center; gap: 1.2vmin; flex-wrap: wrap; }
  .detail { font-size: clamp(14px, 2.1vmin, 28px); color: var(--text-2); margin-top: 1.2vmin; }

  .tag {
    font-size: clamp(10px, 1.35vmin, 17px); font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; padding: .4vmin 1.1vmin; border-radius: 6px;
    background: var(--panel-2); color: var(--text-2);
  }
  .tag.employee { background: rgba(57,135,229,.2); color: #79b3f5; }
  .tag.ojt { background: rgba(12,163,12,.2); color: #63cf63; }
  .tag.contractor { background: rgba(217,89,38,.2); color: #f0966b; }
  .tag.method { background: rgba(255,255,255,.09); color: var(--text-2); }

  /* ---- feed ---- */
  .feed { display: flex; flex-direction: column; gap: 0; overflow: hidden; }
  .feed .row {
    display: flex; align-items: center; gap: 1.4vmin; padding: .9vmin 0;
    border-bottom: 1px solid var(--line); font-size: clamp(13px, 1.85vmin, 24px);
  }
  .feed .row:last-child { border-bottom: none; }
  /* `display: flex` above out-specifies the browser's own [hidden] rule, so a
     trimmed row would stay on screen. Say it explicitly. */
  .feed .row[hidden] { display: none; }
  .feed .t { color: var(--muted); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .feed .n { font-weight: 600; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feed .d { color: var(--muted); flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis;
             white-space: nowrap; max-width: 32%; }
  .feed .mark { width: 1.1vmin; height: 1.1vmin; min-width: 8px; min-height: 8px;
                border-radius: 50%; flex: 0 0 auto; background: var(--in); }
  .feed .row.out .mark { background: var(--out); }
  .feed .dir { font-size: clamp(9px, 1.2vmin, 15px); font-weight: 800; letter-spacing: .1em;
               color: var(--in); flex: 0 0 auto; width: 3.4em; }
  .feed .row.out .dir { color: var(--out); }

  /* ---- service + counters ---- */
  /* Every type has a row, and a row with nothing in it still shows its zero.
     A line that disappears when it is empty leaves the reader wondering
     whether it was counted at all. */
  .stats { display: flex; flex-direction: column; }
  .stats .r {
    display: flex; align-items: baseline; gap: 1.4vmin; padding: .75vmin 0;
    border-bottom: 1px solid var(--line); font-size: clamp(13px, 1.9vmin, 25px);
  }
  .stats .r:last-child { border-bottom: none; }
  .stats .r .k { color: var(--text-2); flex: 1 1 auto;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stats .r .n { font-weight: 700; font-variant-numeric: tabular-nums; }
  .stats .r.total { border-bottom: 1px solid var(--line); }
  .stats .r.total .k { color: var(--text); font-weight: 700; }
  .stats .r.total .n { font-size: clamp(20px, 3.2vmin, 44px); font-weight: 800; letter-spacing: -.02em; }
  .stats .r .n.zero { color: var(--muted); }
  .stats .r .n .o { color: var(--out); }
  .stats .r .n .i { color: var(--in); }
  .stats .r .n .sep { color: var(--muted); font-weight: 400; padding: 0 .3vmin; }

  .counters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2vmin; }
  .counter { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
             padding: 1.6vmin 1.8vmin; }
  .counter .v { font-size: clamp(26px, 5vmin, 70px); font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .counter .k { font-size: clamp(10px, 1.35vmin, 17px); font-weight: 700; letter-spacing: .12em;
                text-transform: uppercase; color: var(--muted); margin-top: .8vmin; }
  .counter.inn .v { color: var(--in); }
  .counter.outt .v { color: var(--out); }
  .counter.overdue .v { color: var(--refused); }
  .counter.overdue.none .v { color: var(--text); }

  .bars { display: flex; flex-direction: column; gap: .9vmin; }
  .bar { display: grid; grid-template-columns: 30% 1fr auto; align-items: center; gap: 1.2vmin;
         font-size: clamp(12px, 1.7vmin, 22px); }
  .bar .lbl { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .track { height: 1.6vmin; min-height: 10px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
  .bar .fill { display: block; height: 100%; background: var(--series-1);
               border-radius: 5px; min-width: 2px; }
  .bar .v { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }

  .spark { display: flex; align-items: flex-end; gap: .5vmin; height: 7vmin; min-height: 42px; margin-top: .6vmin; }
  .spark i { flex: 1 1 0; display: flex; flex-direction: column-reverse; gap: 2px; min-height: 2px; }
  .spark i b { display: block; background: var(--in); border-radius: 3px 3px 0 0; min-height: 2px; }
  .spark i u { display: block; background: var(--out); border-radius: 3px 3px 0 0; min-height: 2px; }
  .spark i.empty { background: var(--panel-2); border-radius: 3px 3px 0 0; }
  .legend { display: flex; gap: 1.4vmin; font-size: clamp(10px, 1.3vmin, 16px); color: var(--muted); }
  .legend s { text-decoration: none; display: inline-flex; align-items: center; gap: .5vmin; }
  .legend s::before { content: ''; width: 1vmin; height: 1vmin; min-width: 8px; min-height: 8px;
                      border-radius: 2px; background: var(--in); }
  .legend s.o::before { background: var(--out); }
  .sparkfoot { display: flex; justify-content: space-between; font-size: clamp(10px, 1.3vmin, 16px);
               color: var(--muted); margin-top: .5vmin; font-variant-numeric: tabular-nums; }

  .scroll { overflow: hidden; }
  .empty { color: var(--muted); font-size: clamp(13px, 1.8vmin, 23px); padding: 2vmin 0; }

  footer { flex: 0 0 auto; display: flex; gap: 1.6vmin; align-items: center;
           padding: 0 .8vmin; font-size: clamp(10px, 1.35vmin, 17px); color: var(--muted); }

  .setup { display: grid; place-items: center; height: 100dvh; padding: 6vmin; text-align: center; }
  .setup div { max-width: 46ch; }
  .setup h1 { font-size: clamp(22px, 4vmin, 44px); margin: 0 0 2vmin; }
  .setup p { font-size: clamp(14px, 2vmin, 22px); color: var(--text-2); line-height: 1.6; }
  .setup code { background: var(--panel-2); padding: .2em .5em; border-radius: 6px; font-size: .92em; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .now { transition: none; } }
</style>
</head>
<body>

<div id="setup" class="setup hidden">
  <div>
    <h1>This screen is not set up yet</h1>
    <p id="setup-msg"></p>
  </div>
</div>

<div id="screen" class="screen hidden">
  <header>
    <div class="site" id="site">Discovery Samal <span>· gate</span></div>
    <div class="spacer"></div>
    <span class="chip" id="chip-priv"></span>
    <span class="chip live" id="chip-net">live</span>
    <span class="clock" id="clock">—</span>
  </header>

  <main>
    <div class="col left">
      <section class="card now" id="now">
        <div class="verdict" id="verdict">Ready</div>
        <div class="who" id="who">Waiting for the next pass</div>
        <div class="org" id="org"></div>
        <div class="detail" id="detail"></div>
      </section>

      <section class="card">
        <h2>Just now</h2>
        <div class="feed scroll" id="feed"><div class="empty">Nobody through yet today.</div></div>
      </section>
    </div>

    <div class="col right">
      <section class="card service" id="service">
        <h2 id="service-h2">On site now</h2>
        <div class="stats" id="stats"></div>
      </section>

      <div class="counters">
        <div class="counter inn"><div class="v" id="c-in">0</div><div class="k">In today</div></div>
        <div class="counter outt"><div class="v" id="c-out">0</div><div class="k">Out today</div></div>
        <div class="counter overdue none"><div class="v" id="c-overdue">0</div><div class="k">Overdue</div></div>
      </div>

      <section class="card scroll">
        <h2 id="h-gates">By gate</h2>
        <div class="bars" id="by-gate"></div>
        <h2 style="margin-top:1.8vmin" id="h-orgs">Busiest departments</h2>
        <div class="bars" id="by-org"></div>
        <h2 style="margin-top:1.8vmin">Last two hours</h2>
        <div class="spark" id="spark"></div>
        <div class="sparkfoot">
          <span id="spark-from">—</span>
          <span class="legend"><s>in</s><s class="o">out</s></span>
          <span id="spark-to">—</span>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <span id="foot-day">—</span>
    <span class="spacer"></span>
    <span id="foot-gate"></span>
    <span>Press <b>P</b> for privacy mode · <b>F</b> for full screen</span>
  </footer>
</div>

<script>
/* ==========================================================================
 *  CONFIGURE ME — the /exec URL of your Apps Script deployment.
 *
 *  The display key goes in this page's own URL, and the gate is optional:
 *
 *    gate.html?key=...              every gate — the security office's board
 *    gate.html?key=...&gate=Main    just that gate — the screen at the barrier
 *
 *  The gate name must match, letter for letter, the name that tablet was given
 *  when it was set up. It is the same name the traffic report groups by.
 * ========================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyxBjxpArNd09-DcJilYhKiGdww-vwR4vKlqAqX_wHEOgxKmuXCVNmU3xnHQ5MEmVQ2/exec';

const $ = s => document.querySelector(s);
const KEY = new URLSearchParams(location.search).get('key') || '';
const GATE = (new URLSearchParams(location.search).get('gate') || '').trim();
const PRIV_KEY = 'ds-display.privacy';

let state = {
  seq: -1,
  privacy: localStorage.getItem(PRIV_KEY) === '1',
  lastGood: 0,
  clearAt: 0,
  polling: 5000
};

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* Every clock on this screen runs on the site's time, not the television's.
 * `skew` is how far this device is from the server; a TV with the wrong clock
 * and a TV in the wrong timezone are both common, and either one showing a
 * time that disagrees with the service window makes the whole screen suspect. */
let siteZone = null, skew = 0;
const siteTime = at => {
  const d = at ? new Date(at) : new Date(Date.now() + skew);
  try {
    return d.toLocaleTimeString('en-GB', {
      hour: '2-digit', minute: '2-digit', hour12: false,
      timeZone: siteZone || undefined
    });
  } catch (e) {
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
};
const timeOf = iso => siteTime(iso);

/** Privacy mode shortens the surname; the attendant still recognises the person. */
function nameOf(full) {
  const n = String(full || '');
  if (!state.privacy) return n;
  const parts = n.trim().split(/\s+/);
  if (parts.length < 2) return n;
  return parts[0] + ' ' + parts[parts.length - 1][0] + '.';
}

const METHOD_LABEL = { qr: 'QR badge', phone: 'Phone', card: 'Card', manual: 'By name', correction: 'Correction' };

async function api(action, params = {}) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action, displayKey: KEY }, params)),
    redirect: 'follow'
  });
  const text = await res.text();
  let json;
  try { json = JSON.parse(text); }
  catch (e) { throw new Error('The server did not return JSON.'); }
  if (!json.ok) { const err = new Error(json.error || 'Request failed.'); err.status = json.status; throw err; }
  return json;
}

/* ------------------------------------------------------------- painting -- */
function paintNow(last) {
  const box = $('#now');
  if (!last) {
    box.className = 'card now';
    $('#verdict').textContent = 'Ready';
    $('#who').textContent = 'Waiting for the next pass';
    $('#org').innerHTML = '';
    $('#detail').textContent = '';
    return;
  }

  const going = last.direction === 'out';
  box.className = 'card now ' + (going ? 'out' : 'in');
  $('#verdict').textContent = going ? 'Signed out' : 'Signed in';
  $('#who').textContent = nameOf(last.fullName);
  $('#org').innerHTML =
    `<span class="tag ${esc(last.personType)}">${esc(last.personType)}</span>` +
    `<span>${esc(last.org || '')}</span>` +
    `<span class="tag method">${esc(METHOD_LABEL[last.method] || last.method)}</span>` +
    (last.vehiclePlate ? `<span class="tag method">${esc(last.vehiclePlate)}</span>` : '');

  // Which gate, always — on the all-gates board it is the whole point, and on a
  // single-gate screen it is the reassurance that the screen is the right one.
  const bits = [cap(last.gate || 'main') + ' gate', timeOf(last.at)];
  $('#detail').textContent = bits.join(' · ');
}

const cap = s => String(s || '').charAt(0).toUpperCase() + String(s || '').slice(1);

function paintFeed(rows) {
  const host = $('#feed');
  if (!rows.length) { host.innerHTML = '<div class="empty">Nobody through yet today.</div>'; return; }
  host.innerHTML = rows.slice(0, 8).map(r => `
    <div class="row ${r.direction === 'out' ? 'out' : ''}">
      <span class="mark"></span>
      <span class="dir">${r.direction === 'out' ? 'OUT' : 'IN'}</span>
      <span class="t">${timeOf(r.at)}</span>
      <span class="n">${esc(nameOf(r.fullName))}</span>
      <span class="d">${esc(GATE ? (r.org || '') : cap(r.gate || 'main'))}</span>
      <span class="tag method">${esc(METHOD_LABEL[r.method] || r.method)}</span>
    </div>`).join('');
  trimFeed();
}

/**
 * Drop any row that does not fit whole. A screen read from across a room should
 * never show the top half of somebody's name — a short list looks deliberate,
 * a sliced one looks broken.
 */
function trimFeed() {
  const host = $('#feed');
  const limit = host.clientHeight;
  if (!limit) return;
  const rows = Array.from(host.querySelectorAll('.row'));
  const top = host.getBoundingClientRect().top;
  rows.forEach(row => {
    const r = row.getBoundingClientRect();
    row.hidden = (r.bottom - top) > limit + 1;
  });
}

// The rows are sized in vmin, so a resized or rotated screen has to re-measure.
window.addEventListener('resize', trimFeed);

function bars(host, rows, colour) {
  const max = Math.max(1, ...rows.map(r => r.value));
  host.innerHTML = rows.length ? rows.map(r => `
    <div class="bar">
      <span class="lbl">${esc(r.label)}</span>
      <span class="track">${r.value ? `<i class="fill" style="width:${Math.round(r.value / max * 100)}%;
        ${colour ? 'background:' + colour : ''}"></i>` : ''}</span>
      <span class="v">${esc(r.text === undefined ? r.value : r.text)}</span>
    </div>`).join('') : '<div class="empty">—</div>';
}

function paintSpark(points) {
  // Both series share one scale. Drawn against separate maxima, a quiet gate's
  // two departures would stand as tall as a shift change, which is exactly the
  // impression a board like this must not give.
  const max = Math.max(1, ...points.map(p => p.in + p.out));
  $('#spark').innerHTML = points.map(p => {
    const total = p.in + p.out;
    if (!total) return '<i class="empty" style="height:2%"></i>';
    const h = Math.max(6, Math.round(total / max * 100));
    const inPct = Math.round(p.in / total * 100);
    return `<i style="height:${h}%">` +
      (p.in ? `<b style="height:${inPct}%"></b>` : '') +
      (p.out ? `<u style="height:${100 - inPct}%"></u>` : '') +
      '</i>';
  }).join('');
  $('#spark-from').textContent = points.length ? points[0].at : '';
  $('#spark-to').textContent = points.length ? points[points.length - 1].at : '';
}

const TYPE_LABEL = {
  employee: 'Employees', ojt: 'OJT', contractor: 'Contractors',
  supplier: 'Suppliers', visitor: 'Visitors'
};
const TYPE_ORDER = ['employee', 'ojt', 'contractor', 'supplier', 'visitor'];

/** One row per line, zeros included and greyed rather than dropped. */
function statRows(host, rows) {
  host.innerHTML = rows.map(r => `
    <div class="r${r.total ? ' total' : ''}">
      <span class="k">${esc(r.label)}</span>
      <span class="n${r.zero ? ' zero' : ''}">${r.html || esc(String(r.value))}</span>
    </div>`).join('');
}

function paint(feed) {
  const scope = feed.gate ? cap(feed.gate) + ' gate' : 'all gates';
  $('#site').innerHTML = esc(feed.site) + ' <span>· ' + esc(scope) + '</span>';
  $('#foot-day').textContent = feed.day;
  $('#foot-gate').textContent = feed.gate
    ? ''
    : (feed.gates.length ? feed.gates.length + ' gates: ' + feed.gates.map(cap).join(' · ') : '');

  if (feed.onsite) {
    // The office board: who is inside the property right now.
    $('#service').className = 'card service';
    $('#service-h2').textContent = 'On site now';
    const c = feed.onsite.counts || {};
    statRows($('#stats'), [{ label: 'Total inside', value: feed.onsite.total, total: true }]
      .concat(TYPE_ORDER.map(t => ({
        label: TYPE_LABEL[t], value: c[t] || 0, zero: !c[t]
      }))));
  } else {
    // A gate's own board. "On site" is a whole-site number and would read here
    // as "this many came through and never left", so this counts what actually
    // happened at this barrier instead — which is what the guard standing at it
    // can check against what they saw.
    $('#service').className = 'card service closed';
    $('#service-h2').textContent = 'Through ' + cap(feed.gate) + ' today';
    const t = feed.byType || {};
    const pair = (i, o) =>
      `<span class="${i ? 'i' : ''}">${i}</span><span class="sep">/</span>` +
      `<span class="${o ? 'o' : ''}">${o}</span>`;
    statRows($('#stats'), [{
      label: 'In / out', total: true,
      html: pair(feed.totals.in, feed.totals.out)
    }].concat(TYPE_ORDER.map(k => ({
      label: TYPE_LABEL[k],
      html: pair((t[k] && t[k].in) || 0, (t[k] && t[k].out) || 0),
      zero: !(t[k] && (t[k].in || t[k].out))
    }))));
  }

  $('#c-in').textContent = feed.totals.in;
  $('#c-out').textContent = feed.totals.out;

  const overdue = feed.onsite ? (feed.onsite.overdue || 0) : 0;
  $('#c-overdue').textContent = feed.onsite ? overdue : '—';
  // Zero overdue is good news and must not be painted as an alarm.
  $('#c-overdue').closest('.counter').className =
    'counter overdue' + (overdue ? '' : ' none');

  // On a single-gate board "by gate" would be one bar about itself, which
  // tells nobody anything.
  if (feed.gate) {
    $('#h-gates').textContent = 'In and out';
    bars($('#by-gate'), [
      { label: 'In', value: feed.totals.in },
      { label: 'Out', value: feed.totals.out }
    ], 'var(--in)');
    $('#h-orgs').textContent = 'Busiest through this gate';
  } else {
    $('#h-gates').textContent = 'By gate';
    bars($('#by-gate'), feed.byGate.map(g => ({
      label: cap(g.name), value: g.in + g.out,
      text: g.in + ' / ' + g.out
    })));
    $('#h-orgs').textContent = 'Busiest departments';
  }

  bars($('#by-org'), (feed.byOrg || []).map(o => ({ label: o.name, value: o.passes })),
    'var(--series-2)');

  paintSpark(feed.throughput);
  paintFeed(feed.recent || []);
  paintNow(feed.last);

  // A gate is quiet for long stretches and then busy for twenty minutes. Poll
  // faster while people are actually moving.
  const recentMovement = (feed.throughput || []).slice(-3)
    .reduce((n, p) => n + p.in + p.out, 0);
  state.polling = recentMovement ? 5000 : 15000;
}

function paintNet(ok) {
  const chip = $('#chip-net');
  const stale = Date.now() - state.lastGood;
  if (ok) { chip.className = 'chip live'; chip.textContent = 'live'; return; }
  chip.className = 'chip stale';
  chip.textContent = stale > 120000
    ? 'no connection for ' + Math.round(stale / 60000) + ' min'
    : 'reconnecting…';
}

function paintPrivacy() {
  $('#chip-priv').textContent = state.privacy ? 'privacy on' : '';
  $('#chip-priv').style.display = state.privacy ? '' : 'none';
}

/* ---------------------------------------------------------------- polling - */
let timer = null;
// The last feed the server sent, kept so the screen can repaint itself without
// asking again — privacy mode has to take effect the instant it is pressed.
let lastFeed = null;

async function tick() {
  try {
    const feed = await api('display.gateFeed', { seq: state.seq, gate: GATE || undefined });
    state.lastGood = Date.now();
    paintNet(true);
    if (feed.timezone) siteZone = feed.timezone;
    if (feed.serverTime) skew = new Date(feed.serverTime).getTime() - Date.now();
    if (feed.changed) {
      state.seq = feed.seq;
      lastFeed = feed;
      paint(feed);
    }
  } catch (e) {
    paintNet(false);
    if (e.status === 403 || e.status === 503) {
      showSetup(e.message);
      return;                       // stop polling on a key problem
    }
  }
  timer = setTimeout(tick, state.polling);
}

function showSetup(msg) {
  clearTimeout(timer);
  $('#screen').classList.add('hidden');
  $('#setup').classList.remove('hidden');
  $('#setup-msg').innerHTML = esc(msg) +
    '<br><br>Open this page as <code>gate.html?key=YOUR_DISPLAY_KEY</code> for all ' +
    'four gates, or <code>gate.html?key=YOUR_DISPLAY_KEY&amp;gate=Main</code> for one. ' +
    'It is the same key the cafeteria screen uses: run <code>generateDisplayKey()</code> ' +
    'in the Apps Script editor once and save the value as the ' +
    '<code>DISPLAY_KEY</code> script property.';
}

/* ------------------------------------------------------------- the room -- */
setInterval(() => {
  $('#clock').textContent = siteTime();
  if (Date.now() - state.lastGood > 20000) paintNet(false);
}, 1000);

document.addEventListener('keydown', ev => {
  const k = ev.key.toLowerCase();
  if (k === 'p') {
    state.privacy = !state.privacy;
    localStorage.setItem(PRIV_KEY, state.privacy ? '1' : '0');
    paintPrivacy();
    // Repaint from what is already in hand. Someone presses P because a name is
    // on the wall right now — waiting up to five seconds for the next poll to
    // redact it defeats the purpose, and re-fetching to do it is a request the
    // quota does not need to spend.
    if (lastFeed) paint(lastFeed);
  }
  if (k === 'f') {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  }
});

/* A wall screen that dims after ten minutes is useless. */
let wakeLock = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) { /* the browser or the OS said no; nothing to do */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { keepAwake(); state.seq = -1; }
});

/* ------------------------------------------------------------------ boot - */
(function boot() {
  paintPrivacy();
  if (API_URL.startsWith('PASTE_')) {
    showSetup('The deployment URL has not been set in this file yet.');
    return;
  }
  if (!KEY) {
    showSetup('No display key in the address.');
    return;
  }
  $('#screen').classList.remove('hidden');
  keepAwake();
  tick();
})();
</script>
</body>
</html>
